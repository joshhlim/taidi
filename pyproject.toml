[project]
name = "taidi-tracker"
version = "0.1.0"
description = "Big Two (Taidi) score keeper with configurable rules and lifetime analytics"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection relies on `Depends(...)` as an argument
# default — that's the documented, required pattern, not the mutable-default
# bug B008 exists to catch.
"api/app/**" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
