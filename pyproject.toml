[project]
name = "taidi-tracker"
version = "0.1.0"
description = "Big Two (Taidi) score keeper with configurable rules and lifetime analytics"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
